name: Package Publish
on:
  release:
    types:
      - published
  # a nightly of the default branch, when it changed since the last one
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: Publish a nightly of the default branch
        type: boolean
        default: false
      dry_run:
        description: "Dry run (build and test npm, but skip publishing)"
        type: boolean
        default: true
      beepboop_execution_id:
        description: Beepboop execution (required for a stable release)
        type: string
      beepboop_title:
        type: string
permissions:
  id-token: write
  contents: read
jobs:
  plan:
    name: Plan
    if: github.repository_id == '1092062077'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      npm_tag: ${{ steps.plan.outputs.npm_tag }}
      docker_tags: ${{ steps.plan.outputs.docker_tags }}
      ref: ${{ steps.plan.outputs.ref }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: kjanat/beepboop/actions/begin@36720c127ca101d85b449b13bff3b8bff1b5f557 # v1.6.0
        id: beepboop
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          stream: main
          operation: promote
        if: inputs.beepboop_execution_id != ''
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.beepboop.outputs.context && fromJSON(steps.beepboop.outputs.context).sourceSha || github.sha }}
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
      - id: plan
        env:
          NIGHTLY: ${{ inputs.nightly || false }}
          RELEASE_CONTEXT: ${{ steps.beepboop.outputs.context }}
          DRY_RUN: ${{ inputs.dry_run || false }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease || false }}
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_CONTEXT}" ]]; then
            [[ "${NIGHTLY}" == false && "${DRY_RUN}" == false ]]
            version="$(jq -er '.version' <<< "${RELEASE_CONTEXT}")"
            sha="$(jq -er '.sourceSha' <<< "${RELEASE_CONTEXT}")"
            jq -e --arg version "${version}" '.operation == "promote" and .draftRelease.tag == $version' <<< "${RELEASE_CONTEXT}"
            [[ "$(git rev-parse HEAD)" == "${sha}" ]]
            gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}" --jq '.commit.verification.verified' | grep -qx true
            npm_tag=latest
            [[ "${version}" == *-* ]] && npm_tag=next
            {
              echo channel=managed
              echo publish=true
              echo "version=${version}"
              echo "npm_tag=${npm_tag}"
              echo docker_tags=
              echo "ref=${sha}"
              echo "targets=$(jq -c . .github/build-matrix.json)"
            } >> "${GITHUB_OUTPUT}"
          elif [[ "${GITHUB_EVENT_NAME}" == schedule || "${NIGHTLY}" == true ]]; then
            base="$(sed -nE '0,/^version *= *"([^"]*)"/s//\1/p' crates/kprint/Cargo.toml)"
            sha="$(git rev-parse HEAD)"
            # plain semver, without the fork's `-kjanat`, like the releases on
            # npm and ghcr.io
            version="${base%-kjanat}-nightly.$(date -u +%Y%m%d).g${sha:0:7}"
            # @kjanat/fmt uploads last, so its nightly of this commit means
            # every package of it is on npm
            last="$(node deployment/npm/nightly.ts view @kjanat/fmt@nightly version)"
            publish=true
            [[ "${last}" == *".g${sha:0:7}" ]] && publish=false
            {
              echo channel=nightly
              echo "publish=${publish}"
              echo "version=${version}"
              echo npm_tag=nightly
              printf 'docker_tags<<EOF\nnightly\n%s\nEOF\n' "${version}"
              echo "ref=${sha}"
              echo "targets=$(jq -c . .github/build-matrix.json)"
            } >> "${GITHUB_OUTPUT}"
            echo "Nightly ${version} (last: ${last:-none}, publish: ${publish})"
          else
            [[ "${GITHUB_EVENT_NAME}" == release && -n "${RELEASE_TAG}" ]] || { echo 'Start stable releases through Beepboop; manual dispatch supports nightlies only.' >&2; exit 1; }
            # Older release tags include the fork suffix, unlike image tags.
            semver="${RELEASE_TAG%-kjanat}"
            docker_tags="${semver}"
            if [[ "${PRERELEASE}" != true ]]; then
              docker_tags+=$'\n'"${semver%.*}"$'\nlatest'
            fi
            {
              echo channel=distribution
              echo publish=true
              echo "version=${RELEASE_TAG}"
              echo npm_tag=
              printf 'docker_tags<<EOF\n%s\nEOF\n' "${docker_tags}"
              echo ref=
              echo 'targets=[]'
            } >> "${GITHUB_OUTPUT}"
          fi
  nightly-build:
    name: Nightly build
    needs: plan
    if: needs.plan.outputs.channel == 'nightly' && needs.plan.outputs.publish == 'true'
    uses: $/.github/workflows/build.yml
    with:
      targets: ${{ needs.plan.outputs.targets }}
      profile: release
      ref: ${{ needs.plan.outputs.ref }}
      version: ${{ needs.plan.outputs.version }}
  publish-cargo:
    if: github.repository_id == '1092062077' && false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621 # v1
      - id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
      - name: Cargo publish
        working-directory: crates/kprint
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          CARGO_REGISTRY_TOKEN: "${{ steps.auth.outputs.token }}"
        run: cargo publish ${DRY_RUN:+--dry-run}
  publish-package-managers:
    name: Homebrew and Scoop
    needs: plan
    if: needs.plan.outputs.channel == 'distribution' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read }
    env:
      TAG: ${{ needs.plan.outputs.version }}
      MANIFESTS: manifests
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Render the cask and the Scoop manifest
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --pattern SHASUMS256.txt --dir "${RUNNER_TEMP}"
          .github/scripts/package-managers.sh render "${TAG}" "${RUNNER_TEMP}/SHASUMS256.txt" "${MANIFESTS}"
          cat "${MANIFESTS}/kprint.rb" "${MANIFESTS}/kprint.json"
      - name: Publish to kjanat/homebrew-tap and kjanat/scoop-bucket
        if: "!(inputs.dry_run || false)"
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: .github/scripts/package-managers.sh publish "${TAG}" "${MANIFESTS}"
  publish-aur:
    name: AUR ${{ matrix.package }}
    needs: plan
    if: needs.plan.outputs.channel == 'distribution' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: { contents: read }
    environment: { name: aur, url: "https://aur.archlinux.org/packages/${{ matrix.package }}" }
    strategy:
      fail-fast: false
      matrix: { package: [kprint-bin, kprint] }
    env:
      TAG: ${{ needs.plan.outputs.version }}
      PKGBUILD: deployment/aur/${{ matrix.package }}/PKGBUILD
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Set the release version
        run: |
          if [[ ! "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a MAJOR.MINOR.PATCH tag, got ${TAG}" >&2
            exit 1
          fi
          sed -i -e "s/^pkgver=.*/pkgver=${TAG}/" -e 's/^pkgrel=.*/pkgrel=1/' -e "s/^_tag=.*/_tag=\"\${pkgver}\"/" "${PKGBUILD}"
          cat "${PKGBUILD}"
      - name: Publish to the AUR
        if: "!(inputs.dry_run || false)"
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: ${{ matrix.package }}
          pkgbuild: ${{ env.PKGBUILD }}
          updpkgsums: true
          test: true
          test_flags: --clean --cleanbuild --syncdeps --noconfirm
          commit_username: ${{ vars.COMMIT_USER }}
          commit_email: ${{ vars.COMMIT_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ env.TAG }}
  build-npm:
    name: npm build
    needs:
      - plan
      - nightly-build
      - release-binaries
    # Stable and nightly builds supply artifacts from this run.
    if: always() && !cancelled() && needs.plan.outputs.publish == 'true' && ((needs.plan.outputs.channel == 'managed' && needs.release-binaries.result == 'success') || (needs.plan.outputs.channel == 'nightly' && needs.nightly-build.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      ZIPS: zips
      EXACT_VERSION: ${{ needs.plan.outputs.channel == 'managed' && '1' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { ref: "${{ needs.plan.outputs.ref || github.sha }}", persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: kprint-*, merge-multiple: true, path: zips }
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
      - name: Install the build's dependencies
        run: deno install --entrypoint deployment/npm/build.ts
      - name: Require every stable platform before packaging
        if: needs.plan.outputs.channel == 'managed'
        run: deno run --allow-read deployment/npm/release.ts assets zips
      - name: Build npm packages
        run: deno run -A deployment/npm/build.ts "${VERSION}" ${ZIPS:+--zips "${ZIPS}"} ${EXACT_VERSION:+--exact-version} --pack deployment/npm/tarballs
      - name: Upload the npm tarballs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-tarballs
          path: deployment/npm/tarballs
          retention-days: 30
  test-npm:
    name: "npm test (${{ matrix.runner }})"
    needs:
      - plan
      - build-npm
    # a skipped nightly build skips this too without always()
    if: always() && !cancelled() && needs.build-npm.result == 'success'
    runs-on: "${{ matrix.runner }}"
    timeout-minutes: 15
    defaults: { run: { shell: bash } }
    strategy:
      matrix: { runner: [ubuntu-latest, macos-latest, windows-latest] }
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Download the npm tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: npm-tarballs
          path: deployment/npm/tarballs
      - name: Start Verdaccio
        run: |
          npx verdaccio@6 --config deployment/npm/verdaccio.yaml --listen 4873 &
          for ((attempt = 0; attempt < 30; attempt++)); do
            if curl -s http://localhost:4873/-/ping > /dev/null 2>&1; then
              echo "Verdaccio is ready"
              break
            fi
            sleep 1
          done
      - name: Configure npm to use Verdaccio
        run: |
          npm config set registry http://localhost:4873/
          npm config set //localhost:4873/:_authToken dummy-token
      - name: Publish packages to Verdaccio
        run: |
          for tarball in deployment/npm/tarballs/*.tgz; do
            npm publish "${tarball}" --registry http://localhost:4873/ --tag ci
          done
          version="$(npm view @kprint/kprint@ci version --registry http://localhost:4873/)"
          echo "KPRINT_VERSION=${version}" >> "${GITHUB_ENV}"
      - name: Create the test projects
        run: mkdir -p "${RUNNER_TEMP}/npm-test" "${RUNNER_TEMP}/readonly-test"
      - name: Test npm install kprint
        working-directory: ${{ runner.temp }}/npm-test
        run: |
          npm init -y
          EXPECTED_VERSION="kprint ${KPRINT_VERSION}"
          npm install "@kprint/kprint@${KPRINT_VERSION}"
          for command in kprint dprint; do
            ACTUAL="$(npx "${command}" -v)"
            echo "${command}: ${ACTUAL}"
            [[ "${ACTUAL}" = "${EXPECTED_VERSION}" || "${ACTUAL}" = "${EXPECTED_VERSION}-kjanat" ]] || { echo "Version mismatch: expected '${EXPECTED_VERSION}', got '${ACTUAL}'"; exit 1; }
          done
      - name: Test kprint via bin.cjs fallback
        working-directory: ${{ runner.temp }}/npm-test
        run: node node_modules/@kprint/kprint/bin.cjs -v
      - name: Test kprint via simulated readonly file system
        working-directory: ${{ runner.temp }}/readonly-test
        run: |
          npm init -y
          npm install "@kprint/kprint@${KPRINT_VERSION}"
          rm -f node_modules/@kprint/kprint/kprint*
          DPRINT_SIMULATED_READONLY_FILE_SYSTEM=1 node node_modules/@kprint/kprint/bin.cjs -v
      - name: Test npm global install kprint
        run: |
          EXPECTED_VERSION="kprint ${KPRINT_VERSION}"
          npm install -g "@kprint/kprint@${KPRINT_VERSION}"
          for command in kprint dprint; do
            ACTUAL="$("${command}" -v)"
            echo "${command}: ${ACTUAL}"
            [[ "${ACTUAL}" = "${EXPECTED_VERSION}" || "${ACTUAL}" = "${EXPECTED_VERSION}-kjanat" ]] || { echo "Version mismatch: expected '${EXPECTED_VERSION}', got '${ACTUAL}'"; exit 1; }
            # verify the global bin entry points directly at the native binary, not bin.cjs
            if [[ "${RUNNER_OS}" = "Windows" ]]; then
              CMD_FILE="$(npm prefix -g)/${command}.cmd"
              grep -q "bin.cjs" "${CMD_FILE}" && { echo "ERROR: ${command}.cmd still points to bin.cjs"; exit 1; }
              echo "${command}.cmd correctly points to native binary"
            else
              LINK="$(command -v "${command}")"
              LINK_TARGET="$(readlink "${LINK}")"
              echo "${command} symlink target: ${LINK_TARGET}"
              echo "${LINK_TARGET}" | grep -q "bin.cjs" && { echo "ERROR: ${command} symlink still points to bin.cjs"; exit 1; }
              echo "${command} symlink correctly points to native binary"
            fi
          done
          npm uninstall -g @kprint/kprint
      - name: Test npm global install kprint (--ignore-scripts)
        run: |
          EXPECTED_VERSION="kprint ${KPRINT_VERSION}"
          npm install -g --ignore-scripts "@kprint/kprint@${KPRINT_VERSION}"
          for command in kprint dprint; do
            ACTUAL="$("${command}" -v)"
            echo "${command}: ${ACTUAL}"
            [[ "${ACTUAL}" = "${EXPECTED_VERSION}" || "${ACTUAL}" = "${EXPECTED_VERSION}-kjanat" ]] || { echo "Version mismatch: expected '${EXPECTED_VERSION}', got '${ACTUAL}'"; exit 1; }
          done
          npm uninstall -g @kprint/kprint
  publish-npm:
    name: npm publish
    needs:
      - plan
      - build-npm
      - test-npm
    if: always() && !cancelled() && !(inputs.dry_run || false) && needs.test-npm.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: kjanat/beepboop/actions/begin@36720c127ca101d85b449b13bff3b8bff1b5f557 # v1.6.0
        id: beepboop
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          stream: main
          operation: promote
        if: needs.plan.outputs.channel == 'managed'
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"
      - name: Download the npm tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: npm-tarballs
          path: deployment/npm/tarballs
      - name: Publish to npm
        if: needs.plan.outputs.channel == 'managed'
        uses: kjanat/beepboop/actions/publish@36720c127ca101d85b449b13bff3b8bff1b5f557 # v1.6.0
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          npm-tarballs: deployment/npm/tarballs
      - name: Publish the nightly to npm
        if: needs.plan.outputs.channel == 'nightly'
        env:
          NPM_TAG: ${{ needs.plan.outputs.npm_tag }}
        run: node deployment/npm/nightly.ts publish deployment/npm/tarballs "${NPM_TAG}"
      - name: Preserve nightly publication receipts
        if: always() && needs.plan.outputs.channel == 'nightly'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nightly-publication-receipts-${{ github.run_attempt }}
          path: deployment/npm/publication-receipts.json
          if-no-files-found: ignore
          retention-days: 30
  docker:
    name: Docker
    needs: [plan, nightly-build]
    if: always() && !cancelled() && !(inputs.dry_run || false) && needs.plan.outputs.publish == 'true' && contains(fromJSON('["success", "skipped"]'), needs.nightly-build.result) && needs.plan.outputs.channel != 'managed'
    permissions: { contents: read, packages: write }
    uses: $/.github/workflows/docker.yml
    with:
      tags: ${{ needs.plan.outputs.docker_tags }}
      release_tag: ${{ needs.plan.outputs.channel == 'distribution' && needs.plan.outputs.version || '' }}
  release-binaries:
    name: Release binaries
    needs: plan
    if: needs.plan.outputs.channel == 'managed'
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: $/.github/workflows/binaries.yml
    with:
      source_sha: ${{ needs.plan.outputs.ref }}
      version: ${{ needs.plan.outputs.version }}
  finalize-release:
    name: Finalize GitHub release
    needs:
      - plan
      - release-binaries
    if: always() && !cancelled() && needs.plan.outputs.channel == 'managed' && needs.release-binaries.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: kjanat/beepboop/actions/begin@36720c127ca101d85b449b13bff3b8bff1b5f557 # v1.6.0
        id: beepboop
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          stream: main
          operation: promote
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
      - uses: kjanat/beepboop/actions/token@36720c127ca101d85b449b13bff3b8bff1b5f557 # v1.6.0
        id: bot
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          permission-contents: write
      - name: Verify draft assets before publishing
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.version }}
          SOURCE_SHA: ${{ needs.plan.outputs.ref }}
        run: |
          gh release view "${RELEASE_TAG}" --json isDraft,targetCommitish,assets > "${RUNNER_TEMP}/release.json"
          deno run --allow-read deployment/npm/release.ts uploaded "${RUNNER_TEMP}/release.json" "${SOURCE_SHA}"
      - uses: kjanat/beepboop/actions/publish-refs@36720c127ca101d85b449b13bff3b8bff1b5f557 # v1.6.0
        env:
          ${{ insert }}: ${{ fromJSON(steps.bot.outputs.gitId) }}
        with:
          token: ${{ steps.bot.outputs.token }}
      - uses: kjanat/beepboop/actions/publish-release@36720c127ca101d85b449b13bff3b8bff1b5f557 # v1.6.0
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
run-name: ${{ inputs.beepboop_title || github.workflow }}
concurrency:
  group: ${{ format('package-publish-{0}', inputs.beepboop_execution_id || github.event.release.tag_name || 'nightly') }}
  cancel-in-progress: false
