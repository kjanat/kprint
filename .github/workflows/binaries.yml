name: Release binaries

on:
  workflow_call:
    inputs:
      source_sha:
        description: Immutable source commit authorized by Beepboop
        required: true
        type: string
      version:
        description: Version and draft release tag authorized by Beepboop
        required: true
        type: string

permissions: { contents: read }

jobs:
  plan:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      ref: ${{ inputs.source_sha }}
      tag: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - id: plan
        run: printf 'targets=%s\n' "$(jq -ce . .github/build-matrix.json)" >> "${GITHUB_OUTPUT}"

  build:
    needs: plan
    uses: $/.github/workflows/build.yml
    with:
      targets: ${{ needs.plan.outputs.targets }}
      profile: release
      ref: ${{ needs.plan.outputs.ref }}
      version: ${{ needs.plan.outputs.tag }}

  upload:
    name: Upload release assets
    needs:
      - plan
      - build
    if: needs.build.result == 'success'
    concurrency:
      group: release-assets-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: kprint-*, merge-multiple: true, path: release-assets }
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
      - name: Require the complete binary matrix
        run: deno run --allow-read deployment/npm/release.ts assets release-assets
      # Releases before kprint had dprint-<target>.zip with dprint in it, which
      # their `dprint upgrade`, the installers and pins (ex. mise,
      # kjanat/install-dprint) still download.
      - name: Package the binaries as dprint too
        run: |
          set -euo pipefail
          for zip in release-assets/kprint-*.zip; do
            name="$(basename "${zip}")"
            dir="${RUNNER_TEMP}/dprint-zips/${name%.zip}"
            mkdir -p "${dir}"
            unzip -q "${zip}" -d "${dir}"
            for exe in kprint kprint.exe; do
              if [[ -e "${dir}/${exe}" ]]; then
                mv "${dir}/${exe}" "${dir}/d${exe#k}"
              fi
            done
            (cd "${dir}" && zip -q -9 "${GITHUB_WORKSPACE}/release-assets/d${name#k}" dprint*)
          done
          ls release-assets
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with: { subject-path: "release-assets/*.zip" }
      - name: Require the planned draft release
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.ref }}
        run: gh release view "${RELEASE_TAG}" --json isDraft,targetCommitish | jq -e --arg sha "${SOURCE_SHA}" ' .isDraft == true and .targetCommitish == $sha'
      - name: Upload binaries
        run: gh release upload "${RELEASE_TAG}" release-assets/*.zip --clobber
      - name: Update checksums for the complete release
        run: |
          gh release view "${RELEASE_TAG}" --json assets > release-assets.json
          jq -er '
            [.assets[] | select(.name | (startswith("kprint-") or startswith("dprint-")) and endswith(".zip"))] | sort_by(.name) |
            if length == 0 then error("No release binaries") else .[] end |
            if (.digest // "" | test("^sha256:[a-f0-9]{64}$")) then
              "\(.digest[7:])  \(.name)"
            else error("Missing SHA-256 digest for " + .name) end
          ' release-assets.json > SHASUMS256.txt
          gh release upload "${RELEASE_TAG}" SHASUMS256.txt --clobber
