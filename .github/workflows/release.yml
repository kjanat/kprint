name: Prepare release
run-name: "${{ inputs.beepboop_title || github.workflow }}"
on:
  workflow_dispatch:
    inputs:
      beepboop_execution_id:
        description: Beepboop preparation execution
        type: string
        required: true
      beepboop_title:
        type: string
        required: false
permissions:
  contents: read
  id-token: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: kjanat/beepboop/actions/begin@e879d3e0443f4fe2e9bca6af75b7ac2e1876cce7 # v1
        id: beepboop
        with:
          execution-id: "${{ inputs.beepboop_execution_id }}"
          stream: main
          operation: prepare
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: "${{ fromJSON(steps.beepboop.outputs.context).sourceSha }}"
          persist-credentials: false
      - uses: kjanat/beepboop/actions/prepare@e879d3e0443f4fe2e9bca6af75b7ac2e1876cce7 # v1
        with:
          context: "${{ steps.beepboop.outputs.context }}"
          mode: apply
      - uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621
      - name: Regenerate the workspace lockfile
        run: cargo update --workspace
      - name: Validate the prepared manifests and lockfile
        run: "cargo metadata --locked --format-version 1 --no-deps | jq '{workspace_members, workspace_root}'"
      - uses: kjanat/beepboop/actions/prepare@e879d3e0443f4fe2e9bca6af75b7ac2e1876cce7 # v1
        with:
          context: "${{ steps.beepboop.outputs.context }}"
          mode: submit
