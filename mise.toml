#:schema https://mise.jdx.dev/schema/mise.json
#:tombi toml-version = "v1.1.0"

[settings]
experimental                        = true
idiomatic_version_file_enable_tools = ["rust"]

[tools]
deno          = "latest"
tombi         = "latest"
runner-run    = "latest"
cargo-nextest = "latest"

[tool_alias]
cargo-nextest = "aqua:nextest-rs/nextest/cargo-nextest"
runner-run    = "github:kjanat/runner"

[env]
_.path = "./bin/"

[wrappers.kprint]
command = "run"
args    = ["run-kprint"]

# for what calls dprint (ex. the editor hook)
[wrappers.dprint]
command = "run"
args    = ["run-kprint"]

[tasks]
fmt = { run = "bin/kfmt", alias = ["fmt", "f", "format"] }
